[project]
name = "atc"
version = "0.1.0"
description = "Airflow Traffic Control - a terminal control tower for Airflow environments behind awkward network paths"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "boto3>=1.35",
]

[project.scripts]
atc = "atc.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
